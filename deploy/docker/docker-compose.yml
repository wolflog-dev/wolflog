# docker compose up -d   puis   docker compose logs wolflog   (identifiants affichés au premier démarrage)
services:
  wolflog:
    image: ghcr.io/wolflog-dev/wolflog:latest
    build: ../..
    restart: unless-stopped
    ports:
      - "5080:5080"   # interface + OTLP/HTTP
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP (port standard)
    volumes:
      - wolflog-data:/data
    environment:
      # Facultatif : sinon générés au premier démarrage (voir les logs du conteneur).
      # Wolflog__Auth__AdminPassword: "changez-moi"
      # Wolflog__Auth__ApiKeys__0: "ma-cle-api"
      Wolflog__Retention__LogsDays: "14"
volumes:
  wolflog-data:
