name: Release

# Publier une version : git tag v0.2.0 && git push origin v0.2.0
# Lancement manuel (Actions > Release > Run workflow) :
#   sans version : construit tout sans rien publier ;
#   avec une version existante (ex. v0.1.0) : publie seulement ses paquets sur NuGet.
# NuGet : Trusted Publishing (aucune clé stockée). Variable du dépôt NUGET_USER = compte nuget.org qui porte la règle.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      nuget_tag:
        description: "Publier sur NuGet les paquets d'une version existante (ex. v0.1.0). Vide : construction à blanc."
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Binaires et paquets NuGet
    if: ${{ !inputs.nuget_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Livrables (interface, tests, Linux x64/arm64, Windows x64, NuGet)
        shell: pwsh
        run: ./build/package.ps1 -Version $(if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-ci' })

      - name: Contenu
        run: ls -l dist dist/nuget

      - name: Version GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.zip dist/nuget/*.nupkg \
            --title "Wolflog ${{ github.ref_name }}" --generate-notes \
            $([[ "${{ github.ref_name }}" == *-* ]] && echo --prerelease)

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: dist/nuget/*.nupkg

  nuget:
    name: Publication NuGet
    needs: package
    # Après une construction de version (tag), ou seul pour republier une version existante.
    if: ${{ always() && vars.NUGET_USER != '' && ((github.ref_type == 'tag' && needs.package.result == 'success') || inputs.nuget_tag) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - if: ${{ !inputs.nuget_tag }}
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget

      - if: ${{ inputs.nuget_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.nuget_tag }}" -R "${{ github.repository }}" -p "*.nupkg" -D nuget

      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "nuget/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  docker:
    name: Image Docker (amd64, arm64)
    if: ${{ !inputs.nuget_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
